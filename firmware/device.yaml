esphome:
  name: room-climate-maintenance
  includes:
    - maintenance_policy.h
  on_boot:
    priority: -100
    then:
      - servo.detach: pointer_servo
esp32:
  board: esp32dev
  framework:
    type: arduino
logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
globals:
  - id: policy
    type: MaintenancePolicy
  - id: last_sample
    type: uint32_t
    initial_value: '0'
output:
  - platform: ledc
    pin: GPIO18
    id: servo_pwm
    frequency: 50 Hz
servo:
  - id: pointer_servo
    output: servo_pwm
    min_level: 2.5%
    idle_level: 7.5%
    max_level: 12.5%
sensor:
  - platform: ina219
    address: 0x40
    shunt_resistance: 0.1 ohm
    max_voltage: 6.0V
    max_current: 1.0A
    update_interval: 1s
    current:
      name: Servo Current
      id: servo_current
      on_value:
        then:
          - lambda: |-
              id(last_sample)=millis();
              id(policy).feed(x);
              if(id(policy).warning) id(pointer_servo).detach();
    bus_voltage:
      name: Servo Supply Voltage
binary_sensor:
  - platform: template
    name: Maintenance Warning
    lambda: 'return id(policy).warning;'
  - platform: template
    name: Baseline Ready
    lambda: 'return id(policy).ready();'
button:
  - platform: template
    name: Reset Baseline
    on_press:
      - servo.detach: pointer_servo
      - lambda: 'id(policy).reset(); id(last_sample)=millis();'
  - platform: template
    name: Small Pointer Motion
    on_press:
      - if:
          condition:
            lambda: 'return id(policy).ready() && uint32_t(millis()-id(last_sample))<3000;'
          then:
            - servo.write:
                id: pointer_servo
                level: 10%
            - delay: 1s
            - servo.detach: pointer_servo
interval:
  - interval: 1s
    then:
      - lambda: |-
          if(uint32_t(millis()-id(last_sample))>=3000){
            id(policy).warning=true;
            id(pointer_servo).detach();
          }
