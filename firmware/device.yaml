substitutions:
  device_name: room-climate-hub-predictive-mai
  friendly_name: "Room Climate Hub Predictive Maintenance"

esphome:
  name: ${device_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"

captive_portal:

sensor:
  - platform: adc
    pin: GPIO34
    name: "Primary input"
    id: primary_input
    update_interval: 1s
    attenuation: auto

output:
  - platform: gpio
    pin: GPIO2
    id: status_output

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return id(primary_input).state >= 0.50f;
          then:
            - output.turn_on: status_output
          else:
            - output.turn_off: status_output
