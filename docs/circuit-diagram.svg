<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="740" viewBox="0 0 1180 740"><title>ESPHome servo current monitoring and Matter bridge</title><rect width="1180" height="740" fill="white"/><g font-family="sans-serif" font-size="18" fill="#152534"><text x="25" y="35">ID5: ESP32 / INA219 / servo — low voltage only</text><rect x="40" y="100" width="310" height="320" fill="#e4f0ff" stroke="#152534"/><text x="65" y="140">ESP32 DevKit / USB powered</text><text x="65" y="195">3V3</text><text x="65" y="245">GND</text><text x="65" y="295">GPIO21 SDA</text><text x="65" y="345">GPIO22 SCL</text><text x="65" y="395">GPIO18 PWM 50 Hz</text><rect x="690" y="100" width="430" height="260" fill="#e8f8f1" stroke="#152534"/><text x="715" y="135">INA219 @0x40, shunt 0.1 Ω</text><text x="715" y="195">VCC 3.3 V</text><text x="715" y="245">GND</text><text x="715" y="295">SDA</text><text x="715" y="345">SCL</text><text x="930" y="190">VIN+</text><text x="1030" y="190">VIN−</text><rect x="690" y="400" width="430" height="145" fill="#fff0dc" stroke="#152534"/><text x="720" y="440">SG90 servo; lightweight pointer</text><text x="720" y="485">Signal 3.3 V PWM</text><text x="930" y="515">V+ 5 V</text><text x="1030" y="515">GND</text><rect x="40" y="470" width="320" height="110" fill="#ffeded" stroke="#152534"/><text x="60" y="510">Separate regulated 5 V supply</text><text x="60" y="555">+5 V through INA219 to servo</text><text x="25" y="630">ESP32 Wi-Fi/native API → Home Assistant → matterbridge-hass / Matterbridge → Matter controller</text><text x="25" y="670">No direct Matter radio in ESPHome firmware. 5 V load rail is isolated from ESP32 3V3.</text><text x="25" y="710">Common ground; dots indicate junctions. VIN+/VIN− are current-path terminals, not sensor logic supply.</text></g><g fill="none" stroke-width="3"><path stroke="#c33" d="M350 190H690"/><path stroke="#333" d="M350 240H610V590H1150V515H1120M690 240H610M360 550H610"/><path stroke="#187b59" d="M350 290H690"/><path stroke="#a67b00" d="M350 340H690"/><path stroke="#2a6cb4" d="M350 390H570V480H690"/><path stroke="#c33" d="M360 510H530V70H965V175M1065 175V385H965V500"/></g><g fill="#333"><circle cx="610" cy="240" r="5"/><circle cx="610" cy="550" r="5"/><circle cx="610" cy="590" r="5"/></g></svg>